name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '!docs/latest.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          lfs: true

      - name: Fetch latest.json from current GitHub Pages
        # The repo's docs/latest.json may be stale. The source of truth is
        # whatever the release workflow last deployed to GitHub Pages.
        # We fetch it and overwrite the repo copy so we never regress.
        run: |
          PAGES_URL="https://pollen-robotics.github.io/reachy-mini-desktop-app/latest.json"
          echo "Fetching current latest.json from GitHub Pages..."
          if curl -sf "$PAGES_URL" -o docs/latest.json; then
            echo "✅ Restored latest.json from GitHub Pages ($(jq -r .version docs/latest.json))"
          else
            echo "⚠️ Could not fetch from GitHub Pages, keeping repo version"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d  # v4.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4.0.0
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
